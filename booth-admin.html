<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ภาพรวมบูธเครือข่าย — เจ้าหน้าที่</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Sarabun','sans-serif']}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="booth-config.js"></script>

<style>
  body{font-family:'Sarabun',sans-serif;background:#f1f5f9;}
  .fade-up{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .pulse-dot{animation:pd 1.6s infinite;}
  @keyframes pd{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body class="min-h-screen">

<div class="max-w-5xl mx-auto px-4 py-6">

  <!-- หัว -->
  <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
    <div>
      <div class="flex items-center gap-2 text-slate-400 text-xs font-semibold mb-1">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> ภาพรวมสำหรับเจ้าหน้าที่
      </div>
      <h1 id="title" class="text-2xl font-extrabold text-slate-800">บูธเครือข่าย</h1>
    </div>
    <div class="flex items-center gap-2">
      <span id="live" class="hidden items-center gap-1.5 text-xs text-emerald-600 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot"></span> อัปเดตสด
      </span>
      <button onclick="exportCSV()" class="px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-50 flex items-center gap-1.5">
        <i data-lucide="download" class="w-4 h-4"></i> CSV
      </button>
      <button onclick="load()" class="px-3 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 flex items-center gap-1.5">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> รีเฟรช
      </button>
    </div>
  </div>

  <!-- สรุป -->
  <div class="grid grid-cols-3 gap-3 mb-5">
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
      <div class="text-xs text-slate-400 font-semibold">บูธที่ลงครบ</div>
      <div class="mt-1"><span id="kpiFull" class="text-2xl font-extrabold text-emerald-600">0</span><span id="kpiBooths" class="text-slate-400 text-sm">/0 บูธ</span></div>
    </div>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
      <div class="text-xs text-slate-400 font-semibold">ลงทะเบียนแล้ว</div>
      <div class="mt-1"><span id="kpiPeople" class="text-2xl font-extrabold text-indigo-600">0</span><span id="kpiTarget" class="text-slate-400 text-sm">/0 ท่าน</span></div>
    </div>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
      <div class="text-xs text-slate-400 font-semibold">ยังไม่มีใครลง</div>
      <div class="mt-1"><span id="kpiEmpty" class="text-2xl font-extrabold text-rose-500">0</span><span class="text-slate-400 text-sm"> บูธ</span></div>
    </div>
  </div>

  <!-- ค้นหา -->
  <div class="relative mb-4">
    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
    <input id="search" oninput="render()" placeholder="ค้นหาชื่อ / บูธ / หน่วยงาน"
      class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-sm">
  </div>

  <div id="banner" class="hidden mb-4 px-4 py-3 bg-amber-50 border border-amber-300 text-amber-800 rounded-xl text-sm flex items-center gap-2">
    <i data-lucide="flask-conical" class="w-4 h-4 shrink-0"></i>
    <span>โหมดทดลอง — ยังไม่ได้เชื่อมฐานข้อมูล กำลังแสดงข้อมูลในเครื่องนี้เท่านั้น (รัน <b>booth-setup.sql</b> เพื่อรวมข้อมูลทุกอุปกรณ์)</span>
  </div>

  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div>

<script>
const CFG = window.BOOTH_CONFIG;
const sb  = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
let MODE='db', rows=[];

const esc = s => (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initial = s => (s||'?').trim().charAt(0).toUpperCase();
const fmtTime = iso => { try{ return new Date(iso).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }catch{ return ''; } };
const icons = () => lucide.createIcons();

document.getElementById('title').textContent = CFG.EVENT_NAME;

function readLocal(){ try{ return JSON.parse(localStorage.getItem('booth_staff_local')||'[]'); }catch{ return []; } }

async function load(){
  try{
    const { data, error } = await sb.from(CFG.TABLE).select('*').order('created_at',{ascending:true});
    if(error) throw error;
    MODE='db'; rows=data||[];
  }catch(e){
    MODE='local'; rows=readLocal();
  }
  document.getElementById('banner').classList.toggle('hidden', MODE==='db');
  document.getElementById('live').classList.toggle('hidden', MODE!=='db');
  document.getElementById('live').classList.toggle('flex', MODE==='db');
  render();
}

function groupByBooth(){
  const map = {};
  CFG.BOOTHS.forEach(b=> map[String(b.id)] = []);
  rows.forEach(r=>{ const k=String(r.booth_id); (map[k]=map[k]||[]).push(r); });
  return map;
}

function render(){
  const cap = CFG.STAFF_PER_BOOTH;
  const map = groupByBooth();
  const q = (document.getElementById('search').value||'').trim().toLowerCase();

  // KPI
  const ids = Object.keys(map);
  let full=0, empty=0, people=0;
  ids.forEach(id=>{ const c=map[id].length; people+=c; if(c>=cap) full++; if(c===0) empty++; });
  document.getElementById('kpiFull').textContent   = full;
  document.getElementById('kpiBooths').textContent = '/'+ids.length+' บูธ';
  document.getElementById('kpiPeople').textContent = people;
  document.getElementById('kpiTarget').textContent = '/'+(CFG.BOOTHS.length*cap)+' ท่าน';
  document.getElementById('kpiEmpty').textContent  = empty;

  // เรียงตามลำดับบูธใน config ก่อน แล้วต่อด้วยบูธแปลกปลอม (ถ้ามี)
  const order = CFG.BOOTHS.map(b=>String(b.id));
  ids.filter(id=>!order.includes(id)).forEach(id=>order.push(id));

  const cards = order.map(id=>{
    const b = CFG.getBooth(id) || { id, name:'บูธ '+id, org:'' };
    const list = (map[id]||[]);
    const c = CFG.colorOf(id);
    const n = list.length, isFull = n>=cap;

    const hay = (b.name+' '+(b.org||'')+' '+id+' '+list.map(r=>r.name+' '+(r.org||'')).join(' ')).toLowerCase();
    if(q && !hay.includes(q)) return '';

    const badge = isFull
      ? `<span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold">ครบ ${n}/${cap}</span>`
      : n>0
        ? `<span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 text-xs font-bold">${n}/${cap}</span>`
        : `<span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-400 text-xs font-bold">0/${cap}</span>`;

    const people = list.map(r=>`
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full ${c.soft} ${c.text} flex items-center justify-center font-bold text-xs shrink-0">${esc(initial(r.name))}</div>
        <div class="min-w-0 flex-1">
          <div class="text-sm font-semibold text-slate-800 truncate">${esc(r.name)}</div>
          ${(r.org||r.phone)?`<div class="text-xs text-slate-400 truncate">${esc([r.org,r.phone].filter(Boolean).join(' · '))}</div>`:''}
        </div>
        <div class="text-xs text-slate-400 shrink-0">${fmtTime(r.created_at)}</div>
      </div>`).join('');

    const empties = Array.from({length:Math.max(0,cap-n)}).map(()=>`
      <div class="flex items-center gap-2.5 opacity-50">
        <div class="w-8 h-8 rounded-full border-2 border-dashed border-slate-200 flex items-center justify-center text-slate-300 shrink-0"><i data-lucide="user" class="w-3.5 h-3.5"></i></div>
        <div class="text-sm text-slate-300">ยังว่าง</div>
      </div>`).join('');

    return `
    <div class="fade-up bg-white rounded-2xl border ${isFull?'border-emerald-200':'border-slate-100'} shadow-sm overflow-hidden">
      <div class="h-1.5 bg-gradient-to-r ${c.grad}"></div>
      <div class="p-4">
        <div class="flex items-start justify-between gap-2 mb-3">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br ${c.grad} text-white flex items-center justify-center font-bold text-sm shrink-0">${esc(b.id)}</div>
            <div class="min-w-0">
              <div class="font-bold text-slate-800 leading-tight truncate">${esc(b.name)}</div>
              ${b.org?`<div class="text-xs text-slate-400 truncate">${esc(b.org)}</div>`:''}
            </div>
          </div>
          ${badge}
        </div>
        <div class="space-y-2">${people}${empties}</div>
      </div>
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('grid').innerHTML = cards ||
    `<div class="col-span-full text-center text-slate-400 py-10">ไม่พบบูธ/รายชื่อที่ตรงกับ "${esc(q)}"</div>`;
  icons();
}

function exportCSV(){
  const map = groupByBooth();
  const lines = [['booth_id','booth_name','org_booth','name','org','phone','time'].join(',')];
  CFG.BOOTHS.forEach(b=>{
    (map[String(b.id)]||[]).forEach(r=>{
      const cells=[b.id, b.name, b.org||'', r.name||'', r.org||'', r.phone||'',
        (()=>{ try{return new Date(r.created_at).toLocaleString('th-TH');}catch{return '';} })()];
      lines.push(cells.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));
    });
  });
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'booth-staff-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

icons();
load();
setInterval(()=>{ if(MODE==='db' && !document.hidden) load(); }, 10000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
